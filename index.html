<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IR Portal – Sign In</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{}}}</script>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-950 via-blue-900 to-indigo-900 flex items-center justify-center p-4">

  <div class="w-full max-w-md">
    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-white/10 backdrop-blur mb-4">
        <span class="text-3xl">👁️</span>
      </div>
      <h1 class="text-2xl font-bold text-white">Image Recognition Portal</h1>
      <p class="text-blue-300 text-sm mt-1">Multi-Market KPI & Image Management</p>
    </div>

    <!-- Card -->
    <div class="bg-white rounded-2xl shadow-2xl p-8 space-y-5">
      <h2 class="text-lg font-semibold text-gray-800">Sign in to your account</h2>

      <!-- Market -->
      <div>
        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Market</label>
        <select id="market" onchange="updateDemoUsers()" class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm bg-white text-gray-700 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
          <option value="">— Select your market —</option>
          <option value="m1">🇺🇸 United States</option>
          <option value="m2">🇬🇧 United Kingdom</option>
          <option value="m3">🇩🇪 Germany</option>
          <option value="m4">🇫🇷 France</option>
        </select>
      </div>

      <!-- Demo role selector -->
      <div id="rolePickerWrapper" class="hidden">
        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Demo: Sign in as</label>
        <div class="grid grid-cols-3 gap-2" id="rolePicker">
          <!-- filled by JS -->
        </div>
      </div>

      <!-- Email -->
      <div>
        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Email</label>
        <input id="email" type="email" placeholder="your@email.com" class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" />
      </div>

      <!-- Password -->
      <div>
        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Password</label>
        <input id="password" type="password" placeholder="••••••••" value="demo1234"
          class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" />
        <p class="text-xs text-gray-400 mt-1">Demo password is pre-filled</p>
      </div>

      <!-- Error -->
      <p id="loginError" class="hidden text-sm text-red-600 bg-red-50 rounded-lg px-3 py-2"></p>

      <!-- Submit -->
      <button onclick="doLogin()" class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold py-3 rounded-xl transition text-sm">
        Sign In →
      </button>
    </div>

    <!-- Footer -->
    <p class="text-center text-blue-400 text-xs mt-6">© 2026 Image Recognition Portal · Confidential</p>
  </div>

  <script>
    // Pre-select UK and populate demo buttons
    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('market').value = 'm1';
      updateDemoUsers();
    });

    function updateDemoUsers() {
      const mkt = document.getElementById('market').value;
      const wrapper = document.getElementById('rolePickerWrapper');
      const picker  = document.getElementById('rolePicker');
      if (!mkt) { wrapper.classList.add('hidden'); return; }

      const users = Data.USERS.filter(u => u.market === mkt);
      const roleColors = { Admin:'bg-blue-50 border-blue-200 text-blue-700 hover:bg-blue-100', Regular:'bg-green-50 border-green-200 text-green-700 hover:bg-green-100' };

      picker.innerHTML = users.slice(0,3).map(u => `
        <button onclick="selectDemo('${u.email}','${u.role}')"
          class="flex flex-col items-center p-3 rounded-xl border text-xs font-medium transition ${roleColors[u.role]||'bg-gray-50'}">
          <span class="font-semibold">${u.role}</span>
          <span class="text-opacity-70 mt-0.5 truncate w-full text-center">${u.name.split(' ')[0]}</span>
        </button>`).join('');

      wrapper.classList.remove('hidden');
    }

    function selectDemo(email, role) {
      document.getElementById('email').value = email;
    }

    function doLogin() {
      const mkt  = document.getElementById('market').value;
      const email= document.getElementById('email').value.trim();
      const pass = document.getElementById('password').value;
      const err  = document.getElementById('loginError');

      if (!mkt)   { showError('Please select a market.'); return; }
      if (!email) { showError('Please enter your email.'); return; }
      if (!pass)  { showError('Please enter your password.'); return; }

      // Find matching user and determine role
      const user = Data.USERS.find(u => u.email === email && u.market === mkt);
      const role = user?.role || null;

      const session = Auth.login(email, pass, mkt, role);
      if (!session) { showError('No account found for this email in the selected market.'); return; }

      window.location.href = 'app.html';
    }

    function showError(msg) {
      const el = document.getElementById('loginError');
      el.textContent = msg;
      el.classList.remove('hidden');
    }

    document.addEventListener('keydown', e => { if (e.key==='Enter') doLogin(); });
  </script>
</body>
</html>
